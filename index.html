<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Configuración de seguridad CSP para autorizar llamadas a ngrok -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' 'unsafe-inline' 'unsafe-eval';
    connect-src 'self' https://*.ngrok-free.dev https://*.ngrok-free.app;
    style-src 'self' 'unsafe-inline';
  ">

  <title>Dashboard de Monitoreo ETL</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --success: #22c55e;
      --error: #ef4444;
      --process: #3b82f6;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .btn-refresh {
      background-color: var(--process);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn-refresh:hover {
      background-color: #2563eb;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background-color: var(--card-bg);
      padding: 1.25rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .stat-card .label {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
    }

    .stat-card .value {
      font-size: 1.75rem;
      font-weight: 700;
    }

    .table-container {
      background-color: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }

    th, td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #0f172a;
      color: var(--text-muted);
      font-weight: 600;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-EXITOSO { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
    .badge-ERROR { background-color: rgba(239, 68, 68, 0.2); color: var(--error); }
    .badge-EN_PROCESO { background-color: rgba(59, 130, 246, 0.2); color: var(--process); }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Monitoreo de Procesos ETL</h1>
      <button class="btn-refresh" onclick="cargarMonitoreo()">Actualizar</button>
    </header>

    <!-- Resumen rápido de métricas -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Total ETLs</div>
        <div class="value" id="stat-total">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Exitosas</div>
        <div class="value" style="color: var(--success);" id="stat-exitosas">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Con Errores</div>
        <div class="value" style="color: var(--error);" id="stat-errores">-</div>
      </div>
      <div class="stat-card">
        <div class="label">En Proceso</div>
        <div class="value" style="color: var(--process);" id="stat-proceso">-</div>
      </div>
    </div>

    <!-- Tabla con los datos devueltos por el Stored Procedure -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Identificador ETL</th>
            <th>Último Estado</th>
            <th>Última Ejecución</th>
            <th>Duración (seg)</th>
            <th>Corridas (24h)</th>
            <th>Promedio (seg)</th>
          </tr>
        </thead>
        <tbody id="tabla-body">
          <tr>
            <td colspan="6" class="loading">Cargando datos del servidor...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // URL generada por ngrok (actualízala si reinicias ngrok)
    const API_URL = "https://pentagram-gaffe-unvalued.ngrok-free.dev/api/GetETLMonitoring";

    async function cargarMonitoreo() {
      const tbody = document.getElementById('tabla-body');
      
      try {
        // Petición con el header para evitar la pantalla de aviso de ngrok
        const response = await fetch(API_URL, {
          method: 'GET',
          headers: {
            'ngrok-skip-browser-warning': 'true',
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`Error HTTP: ${response.status}`);
        }

        const data = await response.json();
        renderizarTabla(data);
        actualizarMetricas(data);

      } catch (error) {
        console.error("Error al cargar datos:", error);
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="loading" style="color: var(--error);">
              Error al conectar con la API: ${error.message}
            </td>
          </tr>`;
      }
    }

    function renderizarTabla(data) {
      const tbody = document.getElementById('tabla-body');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="loading">No hay datos disponibles</td></tr>';
        return;
      }

      data.forEach(item => {
        const tr = document.createElement('tr');
        
        // Determinar clase de estilo según estado
        const estadoClass = item.ultimoEstado ? `badge-${item.ultimoEstado}` : '';

        tr.innerHTML = `
          <td><strong>${item.identificadorETL || '-'}</strong></td>
          <td><span class="badge ${estadoClass}">${item.ultimoEstado || 'DESCONOCIDO'}</span></td>
          <td>${item.ultimaEjecucion ? item.ultimaEjecucion.replace('T', ' ') : '-'}</td>
          <td>${item.ultimaDuracionSeg !== null ? item.ultimaDuracionSeg : '-'}</td>
          <td>${item.totalCorridas24h || 0}</td>
          <td>${item.tiempoPromedioSeg !== null ? item.tiempoPromedioSeg : '-'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function actualizarMetricas(data) {
      document.getElementById('stat-total').textContent = data.length;
      
      const exitosas = data.filter(d => d.ultimoEstado === 'EXITOSO').length;
      const errores = data.filter(d => d.ultimoEstado === 'ERROR').length;
      const enProceso = data.filter(d => d.ultimoEstado === 'EN_PROCESO').length;

      document.getElementById('stat-exitosas').textContent = exitosas;
      document.getElementById('stat-errores').textContent = errores;
      document.getElementById('stat-proceso').textContent = enProceso;
    }

    // Cargar los datos automáticamente al abrir la página
    cargarMonitoreo();
  </script>
</body>
</html>
